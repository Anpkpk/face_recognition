<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Application - Face Recognition</title>
<style>
  body {
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f5f5f5;
    color: #333;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #leftPanel, #rightPanel {
    padding: 20px;
    box-sizing: border-box;
  }
  #leftPanel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  #cameraView {
    background: #666;
    border-radius: 20px;
    border: 3px solid #000;
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    color: #fff;
    font-size: 24px;
  }
  #cameraView video {
    max-height: 100%;
    max-width: 100%;
    border-radius: 17px;
    display: block;
  }

  #overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  #labelResult, #labelRegister {
    font-size: 18px;
    font-weight: bold;
    color: #000;
    height: 60px;
    line-height: 60px;
    text-align: center;
    background: #fff;
    border-radius: 12px;
    border: 3px solid #000;
  }
  #rightPanel {
    flex: 0 0 250px;
    background: #f5f5f5;
    border-left: 3px solid #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .card {
    background: #c8b3ff;
    border-radius: 18px;
    padding: 40px 20px;
    width: 80%;
    text-align: center;
    border: 3px solid #000;
  }
  button {
    background: #c8b3ff;
    color: #000;
    font-size: 16px;
    font-weight: bold;
    border: 3px solid #000;
    border-radius: 16px;
    padding: 14px;
    width: 100%;
    cursor: pointer;
    transition: 0.25s ease;
  }
  button:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
  }

  /* Register dialog styles */
  #registerDialog {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    color: #333;
    border: 3px solid #000;
    border-radius: 16px;
    padding: 30px 20px;
    width: 350px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    display: none;
    z-index: 9999;
    animation: popIn 0.25s ease;
    flex-direction: column;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translate(-50%, -60%) scale(0.8); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  #registerDialog label {
    font-size: 14px;
    color: #333;
    margin-bottom: 5px;
  }
  #registerDialog input[type="text"], #registerDialog input[type="password"] {
    padding: 8px;
    background: #fff;
    color: #333;
    border: 2px solid #000;
    border-radius: 10px;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 15px;
  }
  #registerDialogButtons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  #registerDialog button {
    background: #c8b3ff;
    color: #000;
    border: 2px solid #000;
    padding: 6px 12px;
    border-radius: 8px;
    width: auto;
  }
  #registerDialog button:hover {
    background: #b39aff;
  }
  #registerDialog .hidden {
    display: none;
  }
</style>
</head>
<body>

<div id="leftPanel">
  <div id="cameraView">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>
  <div id="labelResult"></div>
  <div id="labelRegister"></div>
</div>

<div id="rightPanel">
  <div class="card">
    <button id="registerButton">register</button>
  </div>
</div>

<!-- Register Dialog -->
<div id="registerDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <h2 id="dialogTitle">Register</h2>
  <div id="passwordSection">
    <label for="passwordInput" style="display:block; margin-bottom:10px;">
      Mật khẩu:
    </label>
    <input type="password" id="passwordInput" placeholder="Nhập mật khẩu..." autocomplete="off" />
  </div>
  <div id="nameSection" class="hidden">
    <label for="nameInput" style="display:block; margin-bottom:10px;">
      Tên:
    </label>
    <input type="text" id="nameInput" placeholder="Nhập tên..." autocomplete="off" />
  </div>
  <div id="registerDialogButtons">
    <button id="cancelBtn">Cancel</button>
    <button id="okBtn">OK</button>
  </div>
</div>
</body>
</html>

<script>
  // === FIX REGISTER DIALOG ===
  const dialog = document.getElementById("registerDialog");
  const btnReg = document.getElementById("registerButton");
  const btnCancel = document.getElementById("cancelBtn");

  // Mặc định dialog ẩn
  dialog.classList.add("hidden");

  // Bấm Register => hiện dialog
  btnReg.onclick = () => {
    dialog.classList.remove("hidden");
  };

  // Cancel => ẩn dialog
  btnCancel.onclick = () => {
    dialog.classList.add("hidden");
  };
</script>

<script src="{{ url_for('static', filename='test.js') }}"></script> <!--index.js --> 
</body>
</html>
