<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Application - Face Recognition</title>
<style>
  body {
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f6f9;
    color: #2c3e50;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #leftPanel, #rightPanel {
    padding: 20px;
    box-sizing: border-box;
  }
  #leftPanel {
    flex: 2;
    display: flex;
    flex-direction: column;
    gap: 25px;
  }
  #cameraView, #croppedView {
    background: white;
    border-radius: 20px;
    border: 2px solid #e0e0e0;
    height: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #cameraView video, #croppedView img {
    max-height: 100%;
    max-width: 100%;
    border-radius: 20px;
  }
  #labelResult, #labelRegister {
    font-size: 18px;
    font-weight: bold;
    color: #2980b9;
    height: 30px;
    line-height: 30px;
    text-align: center;
  }
  #rightPanel {
    flex: 1;
    background-color: #ecf0f1;
    border-left: 2px solid #dcdcdc;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding-top: 150px;
  }
  .card {
    background-color: white;
    border-radius: 18px;
    border: 1px solid #dcdcdc;
    padding: 40px 20px;
    width: 80%;
    text-align: center;
  }
  button {
    background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
    color: white;
    font-size: 16px;
    font-weight: bold;
    border-radius: 12px;
    padding: 10px;
    width: 100%;
    border: none;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  button:hover {
    background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
  }
  button:active {
    background-color: #2ecc71;
  }

  /* Register dialog styles */
  #registerDialog {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #f8f9fa;
    border-radius: 12px;
    padding: 30px 20px;
    width: 350px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    display: none;
    flex-direction: column;
  }
  #registerDialog label {
    font-size: 14px;
    color: #333;
    margin-bottom: 5px;
  }
  #registerDialog input[type="text"], #registerDialog input[type="password"] {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 10px;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 15px;
  }
  #registerDialogButtons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  #registerDialog button {
    background: white;
    color: black;
    border: 1px solid black;
    padding: 6px 12px;
    border-radius: 8px;
    width: auto;
  }
  #registerDialog button:hover {
    background: #f2f2f2;
  }
  #registerDialog .hidden {
    display: none;
  }
</style>
</head>
<body>

<div id="leftPanel">
  <div id="cameraView">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay" style="position: absolute; top: 22px; left: 106px;"></canvas>
  </div>
  <div id="labelResult">Kết quả nhận diện</div>
  <div id="labelRegister"></div>
  <div id="croppedView">
    <img id="croppedImage" style="width:200px; height:200px; object-fit:cover; border:1px solid #ccc;" alt="Ảnh crop"/>
  </div>
</div>

<div id="rightPanel">
  <div class="card">
    <button id="registerButton">Register</button>
  </div>
</div>

<!-- Register Dialog -->
<div id="registerDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <h2 id="dialogTitle">Register</h2>
  <div id="passwordSection">
    <label for="passwordInput">Mật khẩu:</label>
    <input type="password" id="passwordInput" placeholder="Nhập mật khẩu..." autocomplete="off" />
  </div>
  <div id="nameSection" class="hidden">
    <label for="nameInput">Tên:</label>
    <input type="text" id="nameInput" placeholder="Nhập tên..." autocomplete="off" />
  </div>
  <div id="registerDialogButtons">
    <button id="cancelBtn">Cancel</button>
    <button id="okBtn">OK</button>
  </div>
</div>

<script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
