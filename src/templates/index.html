<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Application - Face Recognition</title>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f5f6fb;
    color: #2c2c2c;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #leftPanel, #rightPanel {
    padding: 20px;
    box-sizing: border-box;
  }

  /* LEFT PANEL full height */
  #leftPanel {
    flex: 2;
    display: flex;
    flex-direction: column;
    gap: 16px;
    height: 100vh;
  }

  /* CAMERA VIEW ăn gần full */
  #cameraView {
    flex: 1;                 /* QUAN TRỌNG */
    min-height: 0;           /* fix flex overflow */
    background: #ffffff;
    border-radius: 24px;
    border: 2px solid #dcdcdc;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }

  #cameraView video {
    width: 100%;
    height: 100%;
    object-fit: cover;       /* full khung, không méo */
    border-radius: 20px;
    display: block;
  }

  #overlay {
    position: absolute;
    inset: 0;          /* top:0 left:0 right:0 bottom:0 */
    width: 100%;
    height: 100%;
    pointer-events: none;
  }


  /* LABELS chỉ chiếm đúng chiều cao cần */
  #labelResult,
  #labelRegister {
    flex-shrink: 0;
    font-size: 18px;
    font-weight: 600;
    color: #5a4bdb;
    height: 28px;
    line-height: 28px;
    text-align: center;
  }

  #rightPanel {
    flex: 1;
    background: #ffffff;
    border-left: 1px solid #e5e5e5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 140px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.03);
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 20px;
    width: 80%;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    border: 1px solid #e0e0e0;
  }

  button {
    background: linear-gradient(135deg, #6c63ff, #8f89ff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 16px;
    padding: 14px;
    width: 100%;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(108,99,255,0.35);
    transition: 0.25s ease;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 35px rgba(108,99,255,0.45);
  }

  /* REGISTER DIALOG */
  #registerDialog {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #ffffff;
    color: #333;
    border: 1px solid #ddd;
    border-radius: 16px;
    padding: 30px 20px;
    width: 350px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    display: none;
    z-index: 9999;
    animation: popIn 0.25s ease;
    flex-direction: column;
  }

  @keyframes popIn {
    from { opacity: 0; transform: translate(-50%, -60%) scale(0.9); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  #registerDialog label {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
    display: block;
  }

  #registerDialog input {
    padding: 12px;
    background: #f2f2f2;
    color: #333;
    border: 1px solid #ccc;
    border-radius: 10px;
    width: 100%;
    margin-bottom: 18px;
    box-sizing: border-box;
  }

  #registerDialogButtons {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 10px;
  }

  #registerDialog button {
    background: #6c63ff;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    width: auto;
    font-weight: 600;
  }


  #registerDialog .hidden {
    display: none;
  }
</style>
</head>

<body>

<div id="leftPanel">
  <div id="cameraView">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="labelResult">Kết quả nhận diện</div>
  <div id="labelRegister"></div>

  <!--
  <div id="croppedView">
    <img id="croppedImage"
         style="width:200px; height:200px; object-fit:cover; border:1px solid #ccc;"
         alt="Ảnh crop"/>
  </div>
  -->
</div>

<div id="rightPanel">
  <div class="card">
    <button id="registerButton">Register</button>
  </div>
</div>

<div id="registerDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <h2 id="dialogTitle">Register</h2>

  <div id="passwordSection">
    <label for="passwordInput">Mật khẩu:</label>
    <input type="password" id="passwordInput" placeholder="Nhập mật khẩu..." autocomplete="off" />
  </div>

  <div id="nameSection" class="hidden">
    <label for="nameInput">Tên:</label>
    <input type="text" id="nameInput" placeholder="Nhập tên..." autocomplete="off" />
  </div>

  <div id="registerDialogButtons">
    <button id="cancelBtn">Cancel</button>
    <button id="okBtn">OK</button>
  </div>
</div>

<script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
