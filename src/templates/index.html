<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Application - Face Recognition</title>
<style>
  body {
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0b0015;
    color: #cfc8ff;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #leftPanel, #rightPanel {
    padding: 20px;
    box-sizing: border-box;
  }
  #leftPanel {
    flex: 2;
    display: flex;
    flex-direction: column;
    gap: 25px;
  }
  #cameraView, #croppedView {
    background:#12001f;
    border-radius: 20px;
    border: 2px solid #e0e0e0;
    height: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  #cameraView video, #croppedView img {
    max-height: 100%;
    max-width: 100%;
    border-radius: 20px;
    border: 1px solid rgba(140, 80, 255, 0.4);
    display: block;
  }

  #cameraView {
    background: #12001f;
    border-radius: 25px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #cameraView video {
    display: block;
    max-width: 100%;
    max-height: 100%;
    border-radius: 20px;
  }

  #overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  #labelResult, #labelRegister {
    font-size: 18px;
    font-weight: bold;
    color: #b889ff;
    height: 30px;
    line-height: 30px;
    text-align: center;
  }
  #rightPanel {
    flex: 1;
    background: #140020;
    border-left: 2px solid rgba(100, 60, 160, 0.35);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding-top: 150px;
    box-shadow: inset 0 0 25px rgba(80, 20, 140, 0.4);
  }
  .card {
    background: #1b022d;
    border-radius: 18px;
    padding: 40px 20px;
    padding: 40px 20px;
    width: 80%;
    text-align: center;
    box-shadow:
      12px 12px 30px #0d0015,
      -12px -12px 30px #26003e;
    border: 1px solid rgba(180, 130, 255, 0.2);
  }
  button {
    background: linear-gradient(135deg, #7a32ff, #b35bff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 16px;
    padding: 14px;
    width: 100%;
    border: none;
    cursor: pointer;
    box-shadow:
      0 10px 25px rgba(150, 80, 255, 0.4),
      inset 0 -5px 15px rgba(0, 0, 0, 0.4);

    transition: 0.25s ease;
  }
  button:hover {
    transform: translateY(-3px);
    box-shadow:
      0 15px 35px rgba(150, 80, 255, 0.6),
      inset 0 -5px 15px rgba(0, 0, 0, 0.5);
  }


  /* Register dialog styles */
  #registerDialog {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #1a0424;
    color: #e4d3ff;
    border: 1px solid rgba(180, 130, 255, 0.4);
    border-radius: 16px;
    padding: 30px 20px;
    width: 350px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    display: none;
    box-shadow: 0 15px 35px rgba(120, 60, 200, 0.6);
    z-index: 9999;
    animation: popIn 0.25s ease;
    flex-direction: column;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translate(-50%, -60%) scale(0.8); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  #registerDialog label {
    font-size: 14px;
    color: #333;
    margin-bottom: 5px;
  }
  #registerDialog input[type="text"], #registerDialog input[type="password"] {
    padding: 8px;
    background: #2a0f3a;
    color: #e4d3ff;
    border: 1px solid #ccc;
    border-radius: 10px;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 15px;
  }
  #registerDialogButtons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  #registerDialog button {
    background: #2a0f3a;
    color: black;
    border: 1px solid black;
    padding: 6px 12px;
    border-radius: 8px;
    width: auto;
  }
  #registerDialog button:hover {
    background: #f2f2f2;
  }
  #registerDialog .hidden {
    display: none;
  }
</style>
</head>
<body>

<div id="leftPanel">
  <div id="cameraView">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>
  <div id="labelResult">Kết quả nhận diện</div>
  <div id="labelRegister"></div>
  <div id="croppedView">
    <img id="croppedImage" style="width:200px; height:200px; object-fit:cover; border:1px solid #ccc;" alt="Ảnh crop"/>
  </div>
</div>

<div id="rightPanel">
  <div class="card">
    <button id="registerButton">Register</button>
  </div>
</div>

<!-- Register Dialog -->
<div id="registerDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <h2 id="dialogTitle">Register</h2>
  <div id="passwordSection">
    <label for="passwordInput">Mật khẩu:</label>
    <input type="password" id="passwordInput" placeholder="Nhập mật khẩu..." autocomplete="off" />
  </div>
  <div id="nameSection" class="hidden">
    <label for="nameInput">Tên:</label>
    <input type="text" id="nameInput" placeholder="Nhập tên..." autocomplete="off" />
  </div>
  <div id="registerDialogButtons">
    <button id="cancelBtn">Cancel</button>
    <button id="okBtn">OK</button>
  </div>
</div>

<script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
