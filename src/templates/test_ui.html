<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Face App UI</title>

<style>
/* ------------------ GLOBAL DARK THEME ------------------ */
body {
  margin: 0;
  height: 100vh;
  background: #08000f;
  font-family: "Segoe UI", sans-serif;
  overflow: hidden;
  color: #cfc8ff;
}

/* ------------------ PARTICLE BACKGROUND ------------------ */
#particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: radial-gradient(circle at center, #1a1030 0%, #08000f 100%);
  pointer-events: none;
}

/* ------------------ CONTAINER ------------------ */
.wrapper {
  position: relative;
  z-index: 5;
  width: 100%;
  height: 100%;
  display: flex;
  gap: 40px;
  justify-content: center;
  align-items: center;
}

/* ------------------ VIDEO WITH PURPLE GLOW ------------------ */
.video-box {
  width: 480px;
  height: 360px;
  background: #000;
  border-radius: 24px;
  overflow: hidden;
  position: relative;
  box-shadow:
    0 0 20px #8b3cff,
    0 0 40px #6a1bff inset;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ------------------ NEON FACE BOX ANIMATION ------------------ */
.face-box {
  position: absolute;
  border: 2px solid #b46aff;
  width: 140px;
  height: 180px;
  top: 90px;
  left: 160px;
  border-radius: 12px;
  animation: neonMove 2s linear infinite;
}

@keyframes neonMove {
  0% { box-shadow: 0 0 5px #b46aff, 0 0 10px #d690ff; }
  50% { box-shadow: 0 0 15px #bf7dff, 0 0 25px #d1a2ff; }
  100% { box-shadow: 0 0 5px #b46aff, 0 0 10px #d690ff; }
}

/* ------------------ RIGHT PANEL UI ------------------ */
.panel {
  width: 320px;
  padding: 30px;
  border-radius: 30px;
  background: #0d0717;
  box-shadow:
    10px 10px 30px #050209,
    -10px -10px 30px #1a102a;
}

/* ------------------ LIQUID REGISTER BUTTON ------------------ */
.btn-liquid {
  position: relative;
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 18px;
  font-size: 20px;
  color: white;
  cursor: pointer;
  background: linear-gradient(135deg, #712bff, #9a4dff);
  overflow: hidden;
  transition: 0.3s ease;
  box-shadow:
    0 8px 25px rgba(128, 60, 255, 0.5),
    inset 0 -5px 15px rgba(0, 0, 0, 0.4);
}

.btn-liquid:hover {
  transform: translateY(-3px);
  box-shadow:
    0 12px 30px rgba(128, 60, 255, 0.6),
    inset 0 -5px 15px rgba(0, 0, 0, 0.45);
}

.btn-liquid:active {
  background: linear-gradient(135deg, #4d1bcc, #7b34f9);
  transform: scale(0.97);
}

/* Liquid animation */
.btn-liquid::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  top: -70%;
  left: -50%;
  background: radial-gradient(circle, rgba(255,255,255,0.35) 20%, transparent 70%);
  animation: liquidMove 4s infinite linear;
}

@keyframes liquidMove {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

</style>
</head>
<body>

<div id="particles"></div>

<div class="wrapper">

  <!-- VIDEO BOX -->
  <div class="video-box">
    <video autoplay muted></video>
    <div class="face-box"></div>
  </div>

  <!-- PANEL -->
  <div class="panel">
    <h2 style="margin-top:0">Register Face</h2>
    <button class="btn-liquid">Register</button>
  </div>

</div>

<!-- SIMPLE PARTICLES -->
<script>
const particles = document.getElementById("particles");

function createParticle() {
  const p = document.createElement("div");
  p.style.position = "absolute";
  p.style.width = p.style.height = Math.random() * 4 + 2 + "px";
  p.style.borderRadius = "50%";
  p.style.background = "rgba(180,130,255,0.6)";
  p.style.top = Math.random() * innerHeight + "px";
  p.style.left = Math.random() * innerWidth + "px";
  p.style.opacity = 0.5;
  p.style.filter = "blur(1px)";

  particles.appendChild(p);

  const duration = 4000 + Math.random() * 4000;

  p.animate(
    [
      { transform: "translateY(0)", opacity: 0.5 },
      { transform: "translateY(-80px)", opacity: 0 }
    ],
    { duration, easing: "linear" }
  ).onfinish = () => p.remove();
}

setInterval(createParticle, 150);
</script>

</body>
</html>
